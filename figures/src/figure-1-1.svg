middle">the page like a person</text><rect x="734" y="470" width="192" height="46" rx="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="830.0" y="499" font-family="IBM Plex Mono" font-size="13.5" font-weight="400" fill="#5A6478" text-anchor="middle">looks like a person</text><circle cx="1060.0" cy="80" r="10" fill="#FFFFFF" stroke="#5A54F0" stroke-width="3"/><rect x="950" y="110" width="220" height="430" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="1060.0" y="150" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="middle">Tool-calling</text><text x="1060.0" y="178" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="middle">agents</text><text x="1060.0" y="218" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle" font-style="italic">Examples</text><text x="1060.0" y="246" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="middle">HTTP APIs</text><text x="1060.0" y="271" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="middle">MCP servers</text><text x="1060.0" y="296" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="middle">WebMCP tools</text><text x="1060.0" y="321" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#171A22" text-anchor="middle"></text><text x="1060.0" y="370" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle" font-style="italic">Wants</text><text x="1060.0" y="400" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">Call declared</text><text x="1060.0" y="426" font-family="Bricolage Grotesque" font-size="19" font-weight="600" fill="#171A22" text-anchor="middle">tools with inputs</text><rect x="964" y="470" width="192" height="46" rx="9" fill="#FFFFFF" stroke="#DCE1EC"