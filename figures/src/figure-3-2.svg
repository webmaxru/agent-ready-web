<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="40" y="44" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#8F5A0C" text-anchor="start">Legacy widget</text><text x="620" y="44" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#3F38D6" text-anchor="start">Semantic form</text><rect x="30" y="64" width="560" height="300" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="94" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">DOM</text><text x="50" y="126" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;div class="widget"&gt;</text><text x="50" y="155" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;input placeholder="Check-in" readonly&gt;</text><text x="50" y="184" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;input placeholder="Check-out" readonly&gt;</text><text x="50" y="213" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;div class="stepper"&gt;</text><text x="50" y="242" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    &lt;div&gt;−&lt;/div&gt;&lt;span&gt;2&lt;/span&gt;&lt;div&gt;+&lt;/div&gt;</text><text x="50" y="271" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;/div&gt;</text><text x="50" y="300" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;div class="btn"&gt;Check&lt;/div&gt;</text><text x="50" y="329" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;/div&gt;</text><line x1="310" y1="370" x2="310" y2="430" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="326" y="406" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">browser builds the tree</text><rect x="30" y="436" width="560" height="190" rx="14" fill="#FFFFFF" stroke="#B87613" stroke-width="2"/><text x="50" y="466" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">Accessibility tree</text><text x="50" y="500" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- textbox "Check-in"   (from placeholder)</text><text x="50" y="530" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- textbox "Check-out"  (from placeholder)</text><text x="50" y="560" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- text: − 2 + Check</text><rect x="610" y="64" width="560" height="300" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="630" y="94" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">DOM</text><text x="630" y="126" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;form id="availability"&gt;</text><text x="630" y="155" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;label for="ci"&gt;Check-in&lt;/label&gt;</text><text x="630" y="184" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;input id="ci" type="date" required&gt;</text><text x="630" y="213" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;label for="g"&gt;Guests&lt;/label&gt;</text><text x="630" y="242" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;p id="h"&gt;Up to 6 guests.&lt;/p&gt;</text><text x="630" y="271" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;input id="g" type="number" max="6"</text><text x="630" y="300" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">         aria-describedby="h"&gt;</text><text x="630" y="329" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;button&gt;Check availability&lt;/button&gt;</text><line x1="890" y1="370" x2="890" y2="430" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="906" y="406" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">browser builds the tree</text><rect x="610" y="436" width="560" height="190" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="630" y="466" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">Accessibility tree</text><text x="630" y="500" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- textbox "Check-in"   required</text><text x="630" y="530" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- spinbutton "Guests": "2"</text><text x="630" y="560" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    description "Up to 6 guests."</text><text x="630" y="590" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- button "Check availability"</text><text x="600" y="672" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">div elements with click handlers become ignored containers. Labels give names, hints give descriptions, attributes give states.</text></svg>
