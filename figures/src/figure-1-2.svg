<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 824" width="1200" height="824"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="824" fill="#FFFFFF"/><text x="60" y="46" font-family="Bricolage Grotesque" font-size="20" font-weight="800" fill="#5A6478" text-anchor="start">Layer</text><text x="330" y="46" font-family="Bricolage Grotesque" font-size="20" font-weight="800" fill="#5A6478" text-anchor="start">The question it answers</text><text x="1140" y="46" font-family="Bricolage Grotesque" font-size="20" font-weight="800" fill="#5A6478" text-anchor="end">Chapters</text><rect x="40" y="66" width="1120" height="108" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="70" y="116" font-family="Bricolage Grotesque" font-size="30" font-weight="800" fill="#171A22" text-anchor="start">Operations</text><text x="330" y="114" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Does it keep working?</text><text x="330" y="146" font-family="Literata" font-size="18" font-weight="400" fill="#5A6478" text-anchor="start">Testing, traffic, standards</text><rect x="980" y="96" width="150" height="48" rx="9" fill="#FFFFFF" stroke="#5A6478" stroke-width="2"/><text x="1055" y="128" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">12</text><rect x="40" y="184" width="1120" height="108" rx="14" fill="#FBEAF3" stroke="#C2468A" stroke-width="2"/><text x="70" y="234" font-family="Bricolage Grotesque" font-size="30" font-weight="800" fill="#171A22" text-anchor="start">Trust</text><text x="330" y="232" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Should anyone let the agent act?</text><text x="330" y="264" font-family="Literata" font-size="18" font-weight="400" fill="#5A6478" text-anchor="start">OAuth, bot identity, security, consent</text><rect x="980" y="214" width="150" height="48" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2"/><text x="1055" y="246" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">4, 10, 11</text><rect x="40" y="302" width="1120" height="108" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="70" y="352" font-family="Bricolage Grotesque" font-size="30" font-weight="800" fill="#171A22" text-anchor="start">Capabilities</text><text x="330" y="350" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Can the agent act?</text><text x="330" y="382" font-family="Literata" font-size="18" font-weight="400" fill="#5A6478" text-anchor="start">APIs, MCP, WebMCP, discovery, commerce</text><rect x="980" y="332" width="150" height="48" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="1055" y="364" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">6 to 9</text><rect x="40" y="420" width="1120" height="108" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="70" y="470" font-family="Bricolage Grotesque" font-size="30" font-weight="800" fill="#171A22" text-anchor="start">Content</text><text x="330" y="468" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Can it read the content cheaply and correctly?</text><text x="330" y="500" font-family="Literata" font-size="18" font-weight="400" fill="#5A6478" text-anchor="start">Structured data, Markdown, llms.txt, sitemaps</text><rect x="980" y="450" width="150" height="48" rx="9" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="2"/><text x="1055" y="482" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">5</text><rect x="40" y="538" width="1120" height="108" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="70" y="588" font-family="Bricolage Grotesque" font-size="30" font-weight="800" fill="#171A22" text-anchor="start">Perception</text><text x="330" y="586" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Can it understand the page?</text><text x="330" y="618" font-family="Literata" font-size="18" font-weight="400" fill="#5A6478" text-anchor="start">Accessibility tree, semantic HTML, stable layout</text><rect x="980" y="568" width="150" height="48" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2"/><text x="1055" y="600" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">2, 3</text><rect x="40" y="656" width="1120" height="108" rx="14" fill="#EEF1F8" stroke="#5A6478" stroke-width="2"/><text x="70" y="706" font-family="Bricolage Grotesque" font-size="30" font-weight="800" fill="#171A22" text-anchor="start">Access</text><text x="330" y="704" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Who gets in, on what terms?</text><text x="330" y="736" font-family="Literata" font-size="18" font-weight="400" fill="#5A6478" text-anchor="start">robots.txt, AI crawler rules, Content Signals</text><rect x="980" y="686" width="150" height="48" rx="9" fill="#FFFFFF" stroke="#5A6478" stroke-width="2"/><text x="1055" y="718" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">4</text><line x1="20" y1="764" x2="20" y2="70" stroke="#5A6478" stroke-width="3" marker-end="url(#arr)"/><text x="600" y="804" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle">Each layer builds on the ones below it. Chapter 1 frames the stack, and Chapter 6 chooses between the interfaces in Capabilities.</text></svg>
