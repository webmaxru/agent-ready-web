<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="520" fill="#FFFFFF"/><rect x="30" y="150" width="220" height="170" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="48" y="182" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A54F0" text-anchor="start">THE GUEST</text><text x="48" y="212" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Astrid</text><text x="48" y="242" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">data subject,</text><text x="48" y="266" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">party to the</text><text x="48" y="290" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">booking contract</text><rect x="300" y="60" width="300" height="350" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="320" y="94" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#B87613" text-anchor="start">THE AGENT PROVIDER'S SYSTEMS</text><text x="320" y="126" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Astrid's assistant</text><text x="320" y="160" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">her instructions</text><text x="320" y="186" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">its memory of her</text><text x="320" y="212" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">other sites it visited</text><text x="320" y="238" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">copies of tool answers</text><text x="320" y="290" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">Governed by the provider's</text><text x="320" y="312" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">terms and its own obligations</text><rect x="690" y="40" width="480" height="390" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="710" y="74" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A54F0" text-anchor="start">NORDLYS CONTROLS</text><rect x="710" y="96" width="440" height="54" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="728" y="120" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">The booking</text><text x="728" y="141" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">name, email, dates, guests</text><rect x="710" y="160" width="440" height="54" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="728" y="184" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">How it was made</text><text x="728" y="205" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">channel, agent, who confirmed</text><rect x="710" y="224" width="440" height="54" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="728" y="248" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">The email to Astrid</text><text x="728" y="269" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">sent to the address she gave</text><rect x="710" y="288" width="440" height="54" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="728" y="312" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Tool-call log</text><text x="728" y="333" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">no arguments, 30 days</text><rect x="710" y="352" width="440" height="54" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="728" y="376" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Access logs</text><text x="728" y="397" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">IP as a daily hash</text><line x1="252" y1="235" x2="298" y2="235" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="275" y="222" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle">asks</text><line x1="604" y1="200" x2="688" y2="200" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="645" y="188" font-family="Literata" font-size="14" fill="#5A6478" text-anchor="middle">tool calls</text><path d="M 920 432 C 920 500, 140 500, 140 322" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="530" y="490" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="middle">transparency email and the agent-activity page go straight to the guest</text></svg>