<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="632" fill="#FFFFFF"/><rect x="200.0" y="30" width="740" height="118" rx="14" fill="#FBF1E1" stroke="#B87613" stroke-width="2"/><text x="224.0" y="68" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Agent evals with real models</text><text x="224.0" y="98" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">injection eval,</text><text x="224.0" y="122" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">task suites (Chapter 7)</text><text x="916.0" y="68" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="end">nightly or before a release</text><text x="916.0" y="96" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="end">a rate out of N, costs money</text><rect x="150.0" y="162" width="840" height="118" rx="14" fill="#E3F5F5" stroke="#0EA5A5" stroke-width="2"/><text x="174.0" y="200" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Agent paths in a real browser</text><text x="174.0" y="230" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">roles and labels, ARIA snapshot,</text><text x="174.0" y="254" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">WebMCP tools, MCP contract</text><text x="966.0" y="200" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="end">every pull request</text><text x="966.0" y="228" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="end">pass or fail, seconds</text><rect x="95.0" y="294" width="950" height="118" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="119.0" y="332" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Deterministic audits</text><text x="119.0" y="362" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">readiness checks, JSON-LD lint, robots.txt,</text><text x="119.0" y="386" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">llms.txt, Lighthouse Agentic Browsing</text><text x="1021.0" y="332" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="end">every pull request</text><text x="1021.0" y="360" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="end">pass or fail against a baseline, minutes</text><rect x="40.0" y="426" width="1060" height="118" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="64.0" y="464" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Unit tests of the checks</text><text x="64.0" y="494" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">the checkers test themselves</text><text x="1076.0" y="464" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="end">every commit</text><text x="1076.0" y="492" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="end">pass or fail, milliseconds</text><line x1="1140" y1="538" x2="1140" y2="40" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="1170" y="294.0" font-family="Literata" font-size="16" fill="#5A6478" text-anchor="middle" transform="rotate(-90 1170 294.0)">closer to real agents: slower, costlier, noisier</text><text x="40" y="586" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">Bottom three layers: deterministic, they block a merge.</text><text x="40" y="612" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">Top layer: probabilistic, it reports a rate that a person reads before a release.</text></svg>