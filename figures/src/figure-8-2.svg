x="58" y="324" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#171A22" text-anchor="start">16-security</text><text x="420" y="324" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">Chapter 16</text><text x="58" y="352" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">guarded tools and a gateway</text><line x1="442" y1="342" x2="556" y2="255.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="406" width="400" height="96" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="58" y="436" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#171A22" text-anchor="start">17-consent</text><text x="420" y="436" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">Chapter 17</text><text x="58" y="464" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">a booking tool that asks first</text><text x="58" y="486" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">(input_required)</text><line x1="442" y1="454" x2="556" y2="265.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="560" y="170" width="250" height="160" rx="14" fill="#FFFFFF" stroke="#3F38D6" stroke-width="3"/><text x="580" y="206" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Registry</text><text x="580" y="236" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">registerMcpTool()</text><text x="580" y="260" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">registerMcpResource()</text><text x="580" y="284" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">registerMcpPrompt()</text><text x="580" y="312" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">stable order, no duplicates</text><rect x="880" y="170" width="280" height="160" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="900" y="206" font-family="Bricolage Grotesque" font-size="20" font-weight="800" fill="#171A22" text-anchor="start">Server factory</text><text x="900" y="236" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">runs on every request,</text><text x="900" y="260" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">builds McpServer from</text><text x="900" y="284" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">the registry</text><line x1="812" y1="250" x2="876" y2="250" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="880" y="400" width="280" height="110" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="900" y="434" font-family="Bricolage Grotesque" font-size="17" font-weight="800" fill="#171A22" text-anchor="start">Every handler gets</text><text x="900" y="462" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#171A22" text-anchor="start">extra.auth</text><text x="900" y="488" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">null until Chapter 14</text><line x1="1020" y1="332" x2="1020" y2="396" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="560" y="400" width="250" height="110" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 5"/><text x="580" y="434" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#5A6478" text-anchor="start">Chapter 14 middleware</text><text x="580" y="462" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">verifies the bearer token,</text><text x="580" y="486" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">c.set('mcpAuth', …)</text><line x1="812" y1="455" x2="876" y2="455" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/></svg>