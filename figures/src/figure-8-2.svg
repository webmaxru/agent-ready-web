<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="580" fill="#FFFFFF"/><rect x="30" y="60" width="300" height="380" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="96" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#B87613" text-anchor="start">HOST</text><text x="50" y="120" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Claude, ChatGPT, Copilot, VS Code…</text><rect x="55" y="150" width="250" height="70" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2"/><text x="75" y="192" font-family="Bricolage Grotesque" font-size="20" font-weight="800" fill="#171A22" text-anchor="start">Model</text><rect x="55" y="280" width="250" height="70" rx="9" fill="#FFFFFF" stroke="#B87613" stroke-width="2"/><text x="75" y="312" font-family="Bricolage Grotesque" font-size="20" font-weight="800" fill="#171A22" text-anchor="start">MCP client</text><text x="75" y="336" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">one per connected server</text><line x1="180" y1="222" x2="180" y2="276" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/><line x1="332" y1="315" x2="446" y2="315" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="420" y="40" width="750" height="520" rx="14" fill="#F6F7FB" stroke="#5A54F0" stroke-width="2"/><text x="440" y="72" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#5A54F0" text-anchor="start">NORDLYS.EXAMPLE</text><rect x="450" y="120" width="180" height="80" rx="9" fill="#FFFFFF" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 5"/><text x="466" y="152" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#5A6478" text-anchor="start">Token check</text><text x="466" y="178" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">Chapter 11</text><rect x="450" y="280" width="180" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="466" y="312" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#171A22" text-anchor="start">Origin check</text><text x="466" y="336" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">own site only</text><rect x="660" y="280" width="190" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="676" y="312" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#171A22" text-anchor="start">createMcpHandler</text><text x="676" y="336" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">factory per request</text><rect x="880" y="280" width="260" height="70" rx="9" fill="#FFFFFF" stroke="#3F38D6" stroke-width="3"/><text x="896" y="312" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">McpServer</text><text x="896" y="336" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">fresh object, no state</text><rect x="880" y="100" width="260" height="110" rx="9" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="896" y="132" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Registry</text><text x="896" y="160" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">4 tools · 2 resources</text><text x="896" y="184" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">1 prompt · later layers</text><line x1="632" y1="315" x2="656" y2="315" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="315" x2="876" y2="315" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="1010" y1="212" x2="1010" y2="276" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><path d="M630,160 L745,160 L745,276" fill="none" stroke="#5A6478" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arr)"/><rect x="660" y="410" width="480" height="64" rx="9" fill="#FFFFFF" stroke="#3F38D6" stroke-width="3"/><text x="680" y="450" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Booking service (shared)</text><rect x="450" y="410" width="180" height="64" rx="9" fill="#EEF1F8" stroke="#5A6478" stroke-width="2"/><text x="466" y="440" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="#171A22" text-anchor="start">/api/v1</text><text x="466" y="462" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">Chapter 8</text><line x1="1010" y1="352" x2="1010" y2="406" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="632" y1="442" x2="656" y2="442" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="660" y="500" width="480" height="44" rx="9" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><text x="680" y="529" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#5A6478" text-anchor="start">Domain functions of the demo app</text><line x1="900" y1="476" x2="900" y2="496" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="50" y="480" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Every request carries its protocol</text><text x="50" y="504" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">version and capabilities in _meta,</text><text x="50" y="528" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">and Mcp-Method in a header.</text><text x="338" y="302" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="#171A22" text-anchor="start">POST /mcp</text><text x="338" y="336" font-family="IBM Plex Mono" font-size="13" font-weight="400" fill="#5A6478" text-anchor="start">HTTPS</text><line x1="332" y1="315" x2="446" y2="315" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/></svg>