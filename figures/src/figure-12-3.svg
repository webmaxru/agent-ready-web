<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="40" y="40" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A6478" text-anchor="start">TRIGGERS</text><text x="150" y="40" font-family="IBM Plex Mono" font-size="16" font-weight="400" fill="#171A22" text-anchor="start">pull_request, push to main, weekly schedule (Monday 05:17 UTC)</text><text x="40" y="84" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A6478" text-anchor="start">STEP</text><text x="560" y="84" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A6478" text-anchor="start">COMPARED WITH</text><text x="880" y="84" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A6478" text-anchor="start">FAILS WHEN</text><rect x="40" y="100" width="470" height="62" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="58" y="127" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Install</text><text x="58" y="150" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">npm ci, Chromium for Playwright</text><line x1="275" y1="162" x2="275" y2="178" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="180" width="470" height="62" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="58" y="207" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Unit tests of the checks</text><text x="58" y="230" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">test/*.test.mjs</text><text x="880" y="216.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">any test fails</text><line x1="275" y1="242" x2="275" y2="258" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="260" width="470" height="62" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="58" y="287" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Start Nordlys Cabins</text><text x="58" y="310" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">server.js --port=4318 --now=2026-11-10</text><text x="880" y="296.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">no answer in 30 s</text><line x1="275" y1="322" x2="275" y2="338" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="340" width="470" height="62" rx="9" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="58" y="367" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Readiness checks</text><text x="58" y="390" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">scripts/readiness.mjs</text><line x1="510" y1="371.0" x2="552" y2="371.0" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 6"/><text x="560" y="376.0" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">baselines/readiness.json</text><text x="880" y="376.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">level drops, a pass stops passing</text><line x1="275" y1="402" x2="275" y2="418" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="420" width="470" height="62" rx="9" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="58" y="447" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Structured data</text><text x="58" y="470" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">scripts/structured-data.mjs</text><line x1="510" y1="451.0" x2="552" y2="451.0" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 6"/><text x="560" y="456.0" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">RULES (in the script)</text><text x="880" y="456.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">any JSON-LD problem</text><line x1="275" y1="482" x2="275" y2="498" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="500" width="470" height="62" rx="9" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="58" y="527" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">robots.txt and llms.txt</text><text x="58" y="550" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">scripts/robots-llms.mjs</text><line x1="510" y1="531.0" x2="552" y2="531.0" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 6"/><text x="560" y="536.0" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">baselines/robots-expectations.json</text><text x="880" y="536.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">access differs from the policy</text><line x1="275" y1="562" x2="275" y2="578" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="580" width="470" height="62" rx="9" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="58" y="607" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Lighthouse Agentic Browsing</text><text x="58" y="630" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">scripts/lighthouse-agentic.mjs, 3 runs</text><line x1="510" y1="611.0" x2="552" y2="611.0" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 6"/><text x="560" y="616.0" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">baselines/lighthouse.json</text><text x="880" y="616.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">a median falls below its budget</text><line x1="275" y1="642" x2="275" y2="658" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="660" width="470" height="62" rx="9" fill="#E3F5F5" stroke="#0EA5A5" stroke-width="2"/><text x="58" y="687" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Agent paths with Playwright</text><text x="58" y="710" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">e2e/agent-paths.spec.js</text><line x1="510" y1="691.0" x2="552" y2="691.0" stroke="#5A6478" stroke-width="2" stroke-dasharray="7 6"/><text x="560" y="696.0" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">layers/10-security/tools.lock.json</text><text x="880" y="696.0" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">any test fails</text><line x1="275" y1="722" x2="275" y2="738" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="740" width="470" height="62" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="58" y="767" font-family="Bricolage Grotesque" font-size="19" font-weight="800" fill="#171A22" text-anchor="start">Keep the reports</text><text x="58" y="790" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">always, even after a failure</text><text x="40" y="838" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Indigo: deterministic audits (they compare with reviewed files). Teal: a real browser. Grey: plumbing.</text></svg>