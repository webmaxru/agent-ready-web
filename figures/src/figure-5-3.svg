<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="590" fill="#FFFFFF"/><rect x="40" y="40" width="355" height="470" rx="14" fill="#FFFFFF" stroke="#5A54F0" stroke-width="3"/><text x="64" y="92" font-family="Bricolage Grotesque" font-size="28" font-weight="800" fill="#3F38D6" text-anchor="start">1  Syntax</text><text x="64" y="128" font-family="Literata" font-size="16.5" fill="#171A22" text-anchor="start">Does it parse and expand?</text><text x="64" y="210" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">JSON.parse every block</text><text x="64" y="240" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">jsonld.expand (9.0.0)</text><text x="64" y="270" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">offline context loader</text><rect x="60" y="370" width="315" height="110" rx="10" fill="#F4F5F9" stroke="#D5D9E4" stroke-width="1.5"/><text x="80" y="412" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Catches: broken JSON,</text><text x="80" y="440" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">invalid JSON-LD</text><line x1="397" y1="275" x2="423" y2="275" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="425" y="40" width="355" height="470" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="3"/><text x="449" y="92" font-family="Bricolage Grotesque" font-size="28" font-weight="800" fill="#0B7F7F" text-anchor="start">2  Vocabulary</text><text x="449" y="128" font-family="Literata" font-size="16.5" fill="#171A22" text-anchor="start">Is every term real, and on the</text><text x="449" y="152" font-family="Literata" font-size="16.5" fill="#171A22" text-anchor="start">right type?</text><text x="449" y="210" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">types and properties vs</text><text x="449" y="240" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">schema.org 30.1 vocabulary</text><text x="449" y="270" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">domainIncludes + subClassOf</text><rect x="445" y="370" width="315" height="110" rx="10" fill="#F4F5F9" stroke="#D5D9E4" stroke-width="1.5"/><text x="465" y="412" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Catches: typos, offers</text><text x="465" y="440" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">on a business, provider</text><line x1="782" y1="275" x2="808" y2="275" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="810" y="40" width="355" height="470" rx="14" fill="#FFFFFF" stroke="#C2468A" stroke-width="3"/><text x="834" y="92" font-family="Bricolage Grotesque" font-size="28" font-weight="800" fill="#C2468A" text-anchor="start">3  Parity</text><text x="834" y="128" font-family="Literata" font-size="16.5" fill="#171A22" text-anchor="start">Does the markup say what the page</text><text x="834" y="152" font-family="Literata" font-size="16.5" fill="#171A22" text-anchor="start">says?</text><text x="834" y="210" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">prices visible on the page</text><text x="834" y="240" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">rating and location shown</text><text x="834" y="270" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">deep link opens the form</text><rect x="830" y="370" width="315" height="110" rx="10" fill="#F4F5F9" stroke="#D5D9E4" stroke-width="1.5"/><text x="850" y="412" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Catches: drift, hidden</text><text x="850" y="440" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">or invented facts</text><text x="40" y="560" font-family="Literata" font-size="17" fill="#5A6478" text-anchor="start">All three run in node --test on every change. The two official validators stay as manual checks.</text></svg>
