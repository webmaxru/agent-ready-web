<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><rect x="40" y="230" width="220" height="130" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="150" y="285" font-family="Bricolage Grotesque" font-size="26" font-weight="800" fill="#171A22" text-anchor="middle">Your page</text><text x="150" y="318" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle" font-style="italic">one layer at a time</text><rect x="400" y="40" width="420" height="150" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="425" y="82" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Server-side scan</text><text x="425" y="116" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">isitagentready rules</text><text x="425" y="150" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Looks at: files and headers</text><text x="425" y="176" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Reports: Level 0 to 5</text><path d="M262 295 C 320 295, 330 115, 396 115" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M822 115 C 880 115, 890 295, 936 295" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="400" y="230" width="420" height="150" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="425" y="272" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Lighthouse Agentic Browsing</text><text x="425" y="306" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">in a real browser</text><text x="425" y="340" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Looks at: the page itself</text><text x="425" y="366" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Reports: audits passed, of N</text><path d="M262 295 C 320 295, 330 305, 396 305" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M822 305 C 880 305, 890 295, 936 295" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="400" y="420" width="420" height="150" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="425" y="462" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Scripted agent walk</text><text x="425" y="496" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">roles, names, labels</text><text x="425" y="530" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Looks at: the task</text><text x="425" y="556" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Reports: steps completed</text><path d="M262 295 C 320 295, 330 495, 396 495" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><path d="M822 495 C 880 495, 890 295, 936 295" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="940" y="215" width="230" height="160" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="1055" y="262" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="middle">Record deltas</text><text x="1055" y="294" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle">per check, with</text><text x="1055" y="318" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle">pinned tool versions</text><text x="1055" y="350" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">Table 2.2</text><path d="M1055 377 L1055 610 Q1055 630 1035 630 L170 630 Q150 630 150 610 L150 366" stroke="#C2468A" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><text x="600" y="668" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#C2468A" text-anchor="middle">Change one layer, then measure again</text></svg>
