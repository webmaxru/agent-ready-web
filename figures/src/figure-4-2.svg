<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 725" width="1200" height="725"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="725" fill="#FFFFFF"/><text x="40" y="45" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#8F5A0C" text-anchor="start">Crawler (by its token)</text><text x="560" y="45" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#3F38D6" text-anchor="start">The group it obeys in robots.txt</text><rect x="560" y="70" width="600" height="180" rx="14" fill="#10141F" stroke="#C2468A" stroke-width="3"/><text x="585" y="108" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start">Training only: no</text><text x="585" y="142" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E6EAF6" text-anchor="start">User-agent: GPTBot</text><text x="585" y="168" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E6EAF6" text-anchor="start">User-agent: Google-Extended  ...</text><text x="585" y="194" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E6EAF6" text-anchor="start">Content-Signal: ...</text><text x="585" y="220" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E7B23D" text-anchor="start">Disallow: /</text><rect x="560" y="275" width="600" height="180" rx="14" fill="#10141F" stroke="#0EA5A5" stroke-width="3"/><text x="585" y="313" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start">Assistants for a person</text><text x="585" y="347" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E6EAF6" text-anchor="start">User-agent: Claude-User</text><text x="585" y="373" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E6EAF6" text-anchor="start">User-agent: ChatGPT-User  ...</text><text x="585" y="399" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#7FD0A6" text-anchor="start">Allow: /</text><text x="585" y="425" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E7B23D" text-anchor="start">Disallow: /account/  ...</text><rect x="560" y="480" width="600" height="180" rx="14" fill="#10141F" stroke="#5A54F0" stroke-width="3"/><text x="585" y="518" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start">Everyone else</text><text x="585" y="552" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E6EAF6" text-anchor="start">User-agent: *</text><text x="585" y="578" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#7FD0A6" text-anchor="start">Allow: /</text><text x="585" y="604" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E7B23D" text-anchor="start">Disallow: /book/</text><text x="585" y="630" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#E7B23D" text-anchor="start">Disallow: /account/  ...</text><rect x="40" y="80" width="300" height="74" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="112" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="start">GPTBot</text><text x="60" y="138" font-family="Literata" font-size="15.5" fill="#5A6478" text-anchor="start">training</text><line x1="342" y1="117" x2="555" y2="152" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="180" width="300" height="74" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="212" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="start">Google-Extended</text><text x="60" y="238" font-family="Literata" font-size="15.5" fill="#5A6478" text-anchor="start">token, no crawler</text><line x1="342" y1="217" x2="555" y2="168" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="280" width="300" height="74" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="312" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="start">Claude-User</text><text x="60" y="338" font-family="Literata" font-size="15.5" fill="#5A6478" text-anchor="start">honours robots.txt</text><line x1="342" y1="317" x2="555" y2="357" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="380" width="300" height="74" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="412" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="start">ChatGPT-User</text><text x="60" y="438" font-family="Literata" font-size="15.5" fill="#5A6478" text-anchor="start">"may not apply"</text><line x1="342" y1="417" x2="555" y2="373" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="8 6"/><rect x="40" y="480" width="300" height="74" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="512" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="start">OAI-SearchBot</text><text x="60" y="538" font-family="Literata" font-size="15.5" fill="#5A6478" text-anchor="start">search</text><line x1="342" y1="517" x2="555" y2="562" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="40" y="580" width="300" height="74" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="612" font-family="IBM Plex Mono" font-size="19" font-weight="600" fill="#171A22" text-anchor="start">Googlebot</text><text x="60" y="638" font-family="Literata" font-size="15.5" fill="#5A6478" text-anchor="start">search</text><line x1="342" y1="617" x2="555" y2="578" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="40" y="705" font-family="Literata" font-size="16.5" fill="#5A6478" text-anchor="start">A crawler reads only the most specific group that names it. Fetchers acting for a person may skip robots.txt entirely (dashed).</text></svg>
