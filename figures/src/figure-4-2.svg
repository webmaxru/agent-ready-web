<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" width="1200" height="515"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="515" fill="#FFFFFF"/><rect x="30" y="220" width="270" height="200" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="256" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#B87613" text-anchor="start">ASK</text><text x="50" y="288" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">robots.txt groups</text><text x="50" y="318" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Allow and Disallow</text><text x="50" y="342" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">per crawler token</text><text x="50" y="376" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">Works for:</text><text x="50" y="400" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Crawlers that comply</text><rect x="320" y="160" width="270" height="260" rx="14" fill="#EEF1F8" stroke="#5A6478" stroke-width="2"/><text x="340" y="196" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#5A6478" text-anchor="start">STATE</text><text x="340" y="228" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Usage signals</text><text x="340" y="258" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Content-Signal,</text><text x="340" y="282" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">aipref (draft), TDMRep,</text><text x="340" y="306" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Google nosnippet</text><text x="340" y="376" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">Works for:</text><text x="340" y="400" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Whoever honours them</text><rect x="610" y="100" width="270" height="320" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="630" y="136" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#0EA5A5" text-anchor="start">DECIDE</text><text x="630" y="168" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#171A22" text-anchor="start">Edge and server rules</text><text x="630" y="198" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">403, 429 or redirect</text><text x="630" y="222" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">per verified identity</text><text x="630" y="376" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">Works for:</text><text x="630" y="400" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">Traffic you can identify</text><rect x="900" y="40" width="270" height="380" rx="14" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="920" y="76" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="start">PROTECT</text><text x="920" y="108" font-family="Bricolage Grotesque" font-size="23" font-weight="800" fill="#FFFFFF" text-anchor="start">Authentication</text><text x="920" y="138" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">Sign-in, tokens,</text><text x="920" y="162" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">scoped agent access</text><text x="920" y="376" font-family="Literata" font-size="15" fill="#FFFFFF" text-anchor="start">Works for:</text><text x="920" y="400" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Everyone, people included</text><line x1="40" y1="460" x2="1150" y2="460" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="40" y="495" font-family="Literata" font-size="18" fill="#171A22" text-anchor="start">More effort, more control: each step catches traffic that ignores the step before it</text></svg>
