<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><text x="40" y="50" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#8F5A0C" text-anchor="start">Who visits</text><text x="430" y="50" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#3F38D6" text-anchor="start">The business decision</text><text x="770" y="50" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#0B7F7F" text-anchor="start">Where it is written</text><rect x="30" y="75" width="350" height="110" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="113" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Search crawlers</text><text x="50" y="143" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Googlebot, OAI-SearchBot,</text><text x="50" y="167" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Claude-SearchBot, PerplexityBot</text><rect x="420" y="75" width="300" height="110" rx="14" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="440" y="117" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Search</text><text x="440" y="151" font-family="Literata" font-size="19" fill="#FFFFFF" text-anchor="start">Be found and linked to?</text><rect x="760" y="75" width="410" height="110" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="780" y="121" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">robots.txt: the * group</text><text x="780" y="153" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">Content-Signal: search=</text><line x1="382" y1="130" x2="416" y2="130" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="722" y1="130" x2="756" y2="130" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="30" y="205" width="350" height="110" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="243" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Search crawlers, for answers</text><text x="50" y="273" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">the same crawlers feed</text><text x="50" y="297" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">AI Overviews and AI answers</text><rect x="420" y="205" width="300" height="110" rx="14" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="440" y="247" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">AI answers</text><text x="440" y="281" font-family="Literata" font-size="19" fill="#FFFFFF" text-anchor="start">Content as input to answers?</text><rect x="760" y="205" width="410" height="110" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="780" y="251" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">Content-Signal: ai-input=</text><text x="780" y="283" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">Google: nosnippet, Search Console</text><line x1="382" y1="260" x2="416" y2="260" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="722" y1="260" x2="756" y2="260" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="30" y="335" width="350" height="110" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="373" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Fetchers acting for a person</text><text x="50" y="403" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">ChatGPT-User, Claude-User,</text><text x="50" y="427" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Perplexity-User, Google-Agent</text><rect x="420" y="335" width="300" height="110" rx="14" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="440" y="377" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Agents for a person</text><text x="440" y="411" font-family="Literata" font-size="19" fill="#FFFFFF" text-anchor="start">May they fetch and act?</text><rect x="760" y="335" width="410" height="110" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="780" y="381" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">robots.txt: a user group</text><text x="780" y="413" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">sign-in for anything private</text><line x1="382" y1="390" x2="416" y2="390" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="722" y1="390" x2="756" y2="390" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="30" y="465" width="350" height="110" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="503" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Training crawlers and tokens</text><text x="50" y="533" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">GPTBot, ClaudeBot, CCBot,</text><text x="50" y="557" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Google-Extended and others</text><rect x="420" y="465" width="300" height="110" rx="14" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="440" y="507" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start">Training</text><text x="440" y="541" font-family="Literata" font-size="19" fill="#FFFFFF" text-anchor="start">May models learn from it?</text><rect x="760" y="465" width="410" height="110" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="780" y="511" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">robots.txt: a training group</text><text x="780" y="543" font-family="IBM Plex Mono" font-size="16.5" font-weight="400" fill="#171A22" text-anchor="start">Content-Signal: ai-train=</text><line x1="382" y1="520" x2="416" y2="520" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="722" y1="520" x2="756" y2="520" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="30" y="615" font-family="Literata" font-size="18" fill="#5A6478" text-anchor="start">robots.txt asks crawlers. Signals state preferences. Only sign-in and edge rules enforce anything.</text></svg>
