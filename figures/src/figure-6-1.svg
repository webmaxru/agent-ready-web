<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="650" fill="#FFFFFF"/><rect x="40" y="60" width="300" height="120" rx="14" fill="#EEF0FE" stroke="#5A54F0" stroke-width="2"/><text x="60" y="96" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">Browser</text><text x="60" y="128" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Accept: text/html,…,*/*;q=0.8</text><rect x="40" y="240" width="300" height="120" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="276" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">Agent</text><text x="60" y="308" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Accept: text/markdown,</text><text x="60" y="333" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">  text/html, */*</text><rect x="40" y="420" width="300" height="120" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="60" y="456" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">Agent, no headers</text><text x="60" y="488" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">GET /cabins/fjellro.md</text><rect x="430" y="150" width="320" height="300" rx="14" fill="#FFFFFF" stroke="#0EA5A5" stroke-width="3"/><text x="450" y="190" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#0B7F7F" text-anchor="start">GET /cabins/fjellro</text><text x="450" y="228" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">1. render the page</text><text x="450" y="256" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">2. explicit text/markdown</text><text x="450" y="284" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">   and q ≥ HTML?</text><text x="450" y="312" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">3. yes: Markdown from</text><text x="450" y="340" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">   the same page data</text><text x="450" y="368" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">.md: internal request,</text><text x="450" y="396" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">   no cookies</text><rect x="840" y="60" width="320" height="170" rx="14" fill="#EEF0FE" stroke="#5A54F0" stroke-width="2"/><text x="860" y="96" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">HTML</text><text x="860" y="128" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Vary: Accept</text><text x="860" y="153" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Link: …fjellro.md;</text><text x="860" y="178" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">  rel="alternate"</text><text x="860" y="203" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">&lt;/llms.txt&gt;; rel="describedby"</text><rect x="840" y="300" width="320" height="200" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="860" y="336" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">Markdown</text><text x="860" y="368" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Vary: Accept</text><text x="860" y="393" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Content-Signal: search=yes,</text><text x="860" y="418" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">  ai-input=yes, ai-train=no</text><text x="860" y="443" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Link: …fjellro; rel="canonical"</text><text x="860" y="468" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">~1/5 of the HTML tokens</text><line x1="342" y1="120" x2="428" y2="220" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="342" y1="300" x2="428" y2="300" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="342" y1="480" x2="428" y2="400" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="752" y1="250" x2="838" y2="150" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="752" y1="360" x2="838" y2="400" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="430" y="520" width="730" height="70" rx="10" fill="#F4F5F9" stroke="#D5D9E4" stroke-width="1.5"/><text x="450" y="563" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="start">Shared cache: one entry per representation, kept apart by Vary: Accept</text><text x="40" y="630" font-family="Literata" font-size="16.5" fill="#5A6478" text-anchor="start">One URL, two representations. HTML stays the default, and Markdown is never chosen by a wildcard.</text></svg>
