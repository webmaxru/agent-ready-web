<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="110" y="46" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#8F5A0C" text-anchor="start">Evidence on the request</text><text x="560" y="46" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#3F38D6" text-anchor="start">What it proves</text><text x="880" y="46" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#0B7F7F" text-anchor="start">Label in the Nordlys log</text><rect x="100" y="70" width="420" height="90" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="120" y="108" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start">Verified Web Bot Auth signature</text><text x="120" y="138" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Signature-Agent + RFC 9421</text><rect x="550" y="70" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="570" y="108" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">This operator's key signed</text><text x="570" y="134" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">this exact request</text><rect x="880" y="70" width="290" height="90" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="900" y="110" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">signed-agent</text><text x="900" y="138" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">evidence: signature</text><line x1="522" y1="115" x2="546" y2="115" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="115" x2="876" y2="115" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="100" y="174" width="420" height="90" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="120" y="212" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start">Published IP range + user agent</text><text x="120" y="242" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">e.g. openai.com/gptbot.json</text><rect x="550" y="174" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="570" y="212" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">Sent from the operator's</text><text x="570" y="238" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">own network</text><rect x="880" y="174" width="290" height="90" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="900" y="214" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">training / search / ...</text><text x="900" y="242" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">evidence: ip-range</text><line x1="522" y1="219" x2="546" y2="219" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="219" x2="876" y2="219" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="100" y="278" width="420" height="90" rx="14" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="120" y="316" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start">Reverse + forward DNS</text><text x="120" y="346" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">e.g. crawl-*.googlebot.com</text><rect x="550" y="278" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="570" y="316" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">The host name belongs</text><text x="570" y="342" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">to the operator</text><rect x="880" y="278" width="290" height="90" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="900" y="318" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">(Chapter 4 check,</text><text x="900" y="346" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">not in the log tool)</text><line x1="522" y1="323" x2="546" y2="323" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="323" x2="876" y2="323" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="100" y="382" width="420" height="90" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="120" y="420" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start">User agent string alone</text><text x="120" y="450" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">GPTBot/1.4, Claude-User ...</text><rect x="550" y="382" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="570" y="420" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">Only what the client</text><text x="570" y="446" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">says about itself</text><rect x="880" y="382" width="290" height="90" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="900" y="422" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">training / search / ...</text><text x="900" y="450" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">evidence: ua-only</text><line x1="522" y1="427" x2="546" y2="427" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="427" x2="876" y2="427" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="100" y="486" width="420" height="90" rx="14" fill="#F9E8F1" stroke="#C2468A" stroke-width="2"/><text x="120" y="524" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start">A claim the evidence contradicts</text><text x="120" y="554" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">wrong network, bad signature</text><rect x="550" y="486" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="570" y="524" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">The claim is false</text><text x="570" y="550" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start"></text><rect x="880" y="486" width="290" height="90" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="900" y="526" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">other-bot</text><text x="900" y="554" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">evidence: spoofed</text><line x1="522" y1="531" x2="546" y2="531" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="531" x2="876" y2="531" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="100" y="590" width="420" height="90" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="120" y="628" font-family="Bricolage Grotesque" font-size="21" font-weight="700" fill="#171A22" text-anchor="start">No claim at all</text><text x="120" y="658" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">an ordinary browser user agent</text><rect x="550" y="590" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><text x="570" y="628" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">Nothing: a person, or an</text><text x="570" y="654" font-family="Literata" font-size="18" font-weight="400" fill="#171A22" text-anchor="start">agent that does not say</text><rect x="880" y="590" width="290" height="90" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="900" y="630" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">unknown</text><text x="900" y="658" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">evidence: none</text><line x1="522" y1="635" x2="546" y2="635" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="852" y1="635" x2="876" y2="635" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="50" y1="664" x2="50" y2="80" stroke="#5A6478" stroke-width="3" marker-end="url(#arr)"/><text x="40" y="684" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">weaker</text><text x="38" y="380" font-family="Literata" font-size="17" fill="#5A6478" transform="rotate(-90 38 380)" text-anchor="middle">stronger evidence</text></svg>