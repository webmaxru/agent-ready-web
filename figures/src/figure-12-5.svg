<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="560" fill="#FFFFFF"/><rect x="30" y="60" width="150" height="90" rx="14" fill="#FFFFFF" stroke="#5A6478" stroke-width="2"/><text x="105" y="98" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="middle">Request</text><text x="105" y="126" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle">from anyone</text><rect x="220" y="40" width="250" height="130" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="240" y="76" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#8F5A0C" text-anchor="start">Layer 15</text><text x="240" y="104" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">Verify signature</text><text x="240" y="136" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">c.set('botIdentity')</text><rect x="510" y="40" width="300" height="130" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="530" y="76" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#0B7F7F" text-anchor="start">Layer 19</text><text x="530" y="104" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">Classify the request</text><text x="530" y="136" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">agents.json + IP ranges</text><text x="530" y="158" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">c.set('agentClass')</text><rect x="850" y="40" width="320" height="130" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="870" y="76" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#3F38D6" text-anchor="start">The site</text><text x="870" y="106" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">pages, /api/v1, /mcp, /ucp</text><text x="870" y="134" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">the same store for all</text><line x1="182" y1="105" x2="216" y2="105" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="472" y1="105" x2="506" y2="105" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="812" y1="105" x2="846" y2="105" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="510" y="260" width="300" height="110" rx="14" fill="#FFFFFF" stroke="#5A6478" stroke-width="2"/><text x="530" y="296" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">JSON log record</text><text x="530" y="326" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">time ip path status ua</text><text x="530" y="348" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">referer signature ...</text><rect x="850" y="260" width="320" height="110" rx="14" fill="#FFFFFF" stroke="#5A6478" stroke-width="2"/><text x="870" y="296" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">booking.created</text><text x="870" y="326" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">attributed to the class</text><text x="870" y="350" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">that made the request</text><path d="M660,172 L660,256" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="672" y="222" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">after the response</text><path d="M1010,172 L1010,256" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="1022" y="222" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="start">event</text><rect x="510" y="430" width="660" height="100" rx="14" fill="#10141F" stroke="#10141F" stroke-width="2"/><text x="540" y="470" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#E6EAF6" text-anchor="start">GET /__agents   GET /__agents.json</text><text x="540" y="505" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#7FD0A6" text-anchor="start">node report.mjs access.log  (any server)</text><path d="M660,372 L660,426" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><path d="M1010,372 L1010,426" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="30" y="300" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">The same classifier runs</text><text x="30" y="326" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">inside the site and on</text><text x="30" y="352" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">exported logs, so both</text><text x="30" y="378" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">give the same numbers.</text></svg>