<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="980" fill="#FFFFFF"/><rect x="110.0" y="30" width="440" height="70" rx="9" fill="#10141F" stroke="#10141F" stroke-width="2"/><text x="330.0" y="61.125" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#E6EAF6" text-anchor="middle">Every site: markup and content formats</text><text x="330.0" y="86.875" font-family="Literata" font-size="14" font-weight="400" fill="#E6EAF6" text-anchor="middle">Stages 1 to 3, Chapters 2 to 5</text><line x1="330" y1="100" x2="330" y2="138" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="110.0" y="140" width="440" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="330.0" y="179.95" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Does your platform ship agent doors?</text><line x1="550.0" y1="175" x2="778" y2="175" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="755" y="165" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">yes</text><rect x="780" y="140" width="380" height="70" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="970.0" y="170.85" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Configure them, build the gaps</text><text x="970.0" y="195.35" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Shopify, WordPress plugin, CDN features</text><line x1="330" y1="210" x2="330" y2="248" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="342" y="235" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="start">for what the platform does not cover</text><rect x="110.0" y="250" width="440" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="330.0" y="289.95" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Do agents need to act on your site?</text><line x1="550.0" y1="285" x2="778" y2="285" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="760" y="275" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">only read</text><rect x="780" y="250" width="380" height="70" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="970.0" y="280.84999999999997" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Stop here: content site</text><text x="970.0" y="305.34999999999997" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Level 3, verify bots at the edge</text><line x1="330" y1="320" x2="330" y2="358" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="342" y="345" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="start">yes</text><rect x="110.0" y="360" width="440" height="70" rx="9" fill="#E9E8FD" stroke="#5A54F0" stroke-width="2"/><text x="330.0" y="390.84999999999997" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Public API on shared business rules</text><text x="330.0" y="415.34999999999997" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Chapter 8, API catalog for Level 4</text><line x1="330" y1="430" x2="330" y2="468" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="110.0" y="470" width="440" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="330.0" y="498.7" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Does the action belong in the</text><text x="330.0" y="521.2" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">user’s browser session?</text><line x1="550.0" y1="505" x2="778" y2="505" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="760" y="495" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">yes</text><rect x="780" y="470" width="380" height="70" rx="9" fill="#E9E8FD" stroke="#5A54F0" stroke-width="2"/><text x="970.0" y="500.84999999999997" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">WebMCP tools</text><text x="970.0" y="525.3499999999999" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Chapter 9, forms first</text><line x1="330" y1="540" x2="330" y2="578" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="342" y="565" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="start">next question either way</text><rect x="110.0" y="580" width="440" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="330.0" y="608.7" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Should assistants reach it</text><text x="330.0" y="631.2" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">without a browser?</text><line x1="550.0" y1="615" x2="778" y2="615" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="760" y="605" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">yes</text><rect x="780" y="580" width="380" height="70" rx="9" fill="#E9E8FD" stroke="#5A54F0" stroke-width="2"/><text x="970.0" y="610.85" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">MCP server</text><text x="970.0" y="635.35" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Chapters 7 and 8, with OAuth (11)</text><line x1="330" y1="650" x2="330" y2="688" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="342" y="675" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="start">next question either way</text><rect x="110.0" y="690" width="440" height="70" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2.5"/><text x="330.0" y="729.95" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Do you run an agent of your own?</text><line x1="550.0" y1="725" x2="778" y2="725" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="760" y="715" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="end">yes</text><rect x="780" y="690" width="380" height="70" rx="9" fill="#E9E8FD" stroke="#5A54F0" stroke-width="2"/><text x="970.0" y="720.85" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">A2A Agent Card and endpoint</text><text x="970.0" y="745.35" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">only then</text><line x1="330" y1="760" x2="330" y2="798" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="342" y="785" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#5A6478" text-anchor="start">no</text><rect x="110.0" y="800" width="440" height="70" rx="9" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="330.0" y="830.85" font-family="Bricolage Grotesque" font-size="18" font-weight="700" fill="#171A22" text-anchor="middle">Skip A2A. Add trust layers</text><text x="330.0" y="855.35" font-family="Literata" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Part 4: OAuth, bot identity, security</text><rect x="40" y="900" width="1120" height="50" rx="9" fill="#FFF6E8" stroke="#B87613" stroke-width="2"/><text x="600" y="932" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#8F5A0C" text-anchor="middle">On every path, agents can still click through your pages. Good markup makes that work too.</text></svg>