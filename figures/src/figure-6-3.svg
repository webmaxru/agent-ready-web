ages as Markdown</text><text x="722" y="418" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">Accept: text/markdown</text><text x="722" y="445" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">or /cabins/fjellro.md</text><text x="722" y="472" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">same facts, ~1/5 of the tokens</text><line x1="462" y1="206" x2="698" y2="200" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="462" y1="324" x2="698" y2="410" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="462" y1="442" x2="698" y2="440" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="462" y1="560" x2="698" y2="470" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="930" y1="292" x2="930" y2="338" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="945" y="322" font-family="Literata" font-size="15" fill="#5A6478" text-anchor="start">Link: rel="alternate"</text><text x="40" y="650" font-family="Literata" font-size="16.5" fill="#5A6478" text-anchor="start">Every entry point ends at the same pages. Agents that negotiate skip straight to Markdown.</text></svg>
