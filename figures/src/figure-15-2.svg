<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><rect width="1200" height="830" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect x="30" y="40" width="420" height="700" rx="14" fill="#10141F" stroke="#10141F" stroke-width="2"/><text x="50" y="82" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="22" fill="#E6EAF6">Signed request</text><text x="50" y="125" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E6EAF6">GET /cabins HTTP/1.1</text><text x="50" y="159" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E6EAF6">Host: nordlys.example</text><text x="50" y="227" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E7B23D">Signature-Agent:</text><text x="72" y="261" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E7B23D">sig1="https://chatgpt.com"</text><text x="50" y="329" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#7FD0A6">Signature-Input: sig1=(</text><text x="72" y="363" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#7FD0A6">"@authority" "@method"</text><text x="72" y="397" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#7FD0A6">"@path"</text><text x="72" y="431" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#7FD0A6">"signature-agent";key="sig1")</text><text x="72" y="465" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E7B23D">;created=1793659269</text><text x="72" y="499" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E7B23D">;expires=1793659569</text><text x="72" y="533" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#9E98FF">;keyid="-LKDDMS1...Ipw"</text><text x="72" y="567" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#7FD0A6">;tag="web-bot-auth"</text><text x="50" y="635" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E6EAF6">Signature:</text><text x="72" y="669" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E6EAF6">sig1=:wDsjolQa...DtDA==:</text><rect x="520" y="95" width="640" height="120" rx="14" fill="#F6F7FB" stroke="#3F38D6" stroke-width="2"/><circle cx="565" cy="155" r="24" fill="#5A54F0"/><text x="565" y="164" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#FFFFFF">1</text><text x="610" y="137" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#171A22">Rebuild the signature base</text><text x="610" y="169" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">one line per covered component,</text><text x="610" y="195" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">plus the "@signature-params" line</text><rect x="520" y="255" width="640" height="120" rx="14" fill="#F6F7FB" stroke="#3F38D6" stroke-width="2"/><circle cx="565" cy="315" r="24" fill="#5A54F0"/><text x="565" y="324" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#FFFFFF">2</text><text x="610" y="297" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#171A22">Find the agent's keys</text><text x="610" y="329" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">Signature-Agent URL on the allowlist?</text><text x="610" y="355" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">fetch its directory: HTTPS, cached, size-limited</text><rect x="520" y="415" width="640" height="120" rx="14" fill="#F6F7FB" stroke="#3F38D6" stroke-width="2"/><circle cx="565" cy="475" r="24" fill="#5A54F0"/><text x="565" y="484" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#FFFFFF">3</text><text x="610" y="457" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#171A22">Pick the key by thumbprint</text><text x="610" y="489" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">JWK SHA-256 thumbprint = keyid,</text><text x="610" y="515" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">inside this agent's directory only</text><rect x="520" y="575" width="640" height="120" rx="14" fill="#F6F7FB" stroke="#3F38D6" stroke-width="2"/><circle cx="565" cy="635" r="24" fill="#5A54F0"/><text x="565" y="644" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#FFFFFF">4</text><text x="610" y="617" text-anchor="start" font-family="Bricolage Grotesque" font-weight="700" font-size="24" fill="#171A22">Check time and signature</text><text x="610" y="649" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">created/expires within the window,</text><text x="610" y="675" text-anchor="start" font-family="Literata" font-size="18" fill="#5A6478">Ed25519 signature over the base</text><line x1="840" y1="215" x2="840" y2="253" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><line x1="840" y1="375" x2="840" y2="413" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><line x1="840" y1="535" x2="840" y2="573" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><line x1="452" y1="155" x2="516" y2="155" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><rect x="520" y="750" width="300" height="52" rx="9" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="670" y="783" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="21" fill="#FFFFFF">verified-agent</text><rect x="860" y="750" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#C2468A" stroke-width="2.5"/><text x="1010" y="783" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="21" fill="#C2468A">invalid + reason</text><line x1="760" y1="697" x2="690" y2="746" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><line x1="920" y1="697" x2="990" y2="746" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><text x="240" y="775" text-anchor="middle" font-family="Literata" font-size="18" fill="#5A6478">Any failed step gives invalid.</text></svg>
