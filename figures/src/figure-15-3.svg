136 L948,405 L971,412" fill="none" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><line x1="932" y1="414" x2="971" y2="430" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><line x1="932" y1="478" x2="971" y2="450" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/><rect x="250" y="575" width="925" height="110" rx="14" fill="#10141F" stroke="#10141F" stroke-width="2"/><text x="275" y="612" text-anchor="start" font-family="Literata" font-size="18" fill="#E6EAF6">Every response from /mcp and /ucp/:</text><text x="275" y="645" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#7FD0A6">RateLimit-Policy: "anonymous";q=60;w=60    RateLimit: "anonymous";r=59;t=60</text><text x="275" y="672" text-anchor="start" font-family="IBM Plex Mono" font-size="17" fill="#E7B23D">over the quota: 429 Too Many Requests + Retry-After</text><line x1="1075" y1="552" x2="1075" y2="571" stroke="#5A6478" stroke-width="2.5" marker-end="url(#a)"/></svg>
