<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="580" fill="#FFFFFF"/><text x="40" y="44" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#5A54F0" text-anchor="start">YOUR OPENAPI OPERATION</text><rect x="40" y="60" width="470" height="470" rx="14" fill="#10141F" stroke="#10141F" stroke-width="2"/><text x="62" y="104" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#9E98FF" text-anchor="start">operationId:</text><text x="62" y="128" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">createBooking</text><text x="62" y="176" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#9E98FF" text-anchor="start">summary:</text><text x="62" y="200" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#7FD0A6" text-anchor="start">Book a cabin for the lead guest</text><text x="62" y="248" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#9E98FF" text-anchor="start">description:</text><text x="62" y="272" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#7FD0A6" text-anchor="start">Only call this after the user</text><text x="62" y="294" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#7FD0A6" text-anchor="start">has confirmed the cabin, the dates…</text><text x="62" y="342" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#9E98FF" text-anchor="start">parameters:</text><text x="62" y="366" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">Idempotency-Key (header)</text><text x="62" y="414" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#9E98FF" text-anchor="start">requestBody:</text><text x="62" y="438" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">cabin, checkIn, checkOut, guests,</text><text x="62" y="460" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">name, email, acceptTerms</text><text x="62" y="500" font-family="IBM Plex Mono" font-size="16" font-weight="600" fill="#9E98FF" text-anchor="start">responses:</text><text x="62" y="522" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#E6EAF6" text-anchor="start">201 · 200 · 400 · 409 · 422 · 429</text><text x="690" y="44" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#B87613" text-anchor="start">THE TOOL THE MODEL READS</text><rect x="690" y="60" width="470" height="340" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="712" y="104" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#B87613" text-anchor="start">name</text><text x="712" y="130" font-family="IBM Plex Mono" font-size="17" font-weight="600" fill="#171A22" text-anchor="start">createBooking</text><text x="712" y="180" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#B87613" text-anchor="start">description</text><text x="712" y="206" font-family="Literata" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">Book a cabin for the lead guest. Only call</text><text x="712" y="228" font-family="Literata" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">this after the user has confirmed the cabin,</text><text x="712" y="250" font-family="Literata" font-size="15" font-weight="400" fill="#171A22" text-anchor="start">the dates and the price…</text><text x="712" y="300" font-family="Bricolage Grotesque" font-size="16" font-weight="800" fill="#B87613" text-anchor="start">inputSchema</text><text x="712" y="326" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">{ Idempotency-Key, cabin, checkIn,</text><text x="712" y="348" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">  checkOut, guests, name, email,</text><text x="712" y="370" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#171A22" text-anchor="start">  acceptTerms }</text><rect x="690" y="430" width="470" height="100" rx="9" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="712" y="468" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Responses and problem types matter later,</text><text x="712" y="492" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">when the call returns and the agent decides</text><text x="712" y="516" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">what to do next.</text><line x1="512" y1="124" x2="706" y2="124" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="512" y1="196" x2="706" y2="204" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="512" y1="276" x2="706" y2="232" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="512" y1="362" x2="706" y2="324" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="512" y1="446" x2="706" y2="350" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="512" y1="516" x2="686" y2="484" stroke="#5A6478" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="600" y="566" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">Imported by Azure API Management, AgentCore Gateway, Copilot Studio, ADK and others</text></svg>