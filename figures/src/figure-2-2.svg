<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="720" fill="#FFFFFF"/><text x="40" y="46" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#3F38D6" text-anchor="start">HTML you write</text><text x="660" y="46" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#8F5A0C" text-anchor="start">Tool the browser builds</text><rect x="30" y="66" width="560" height="620" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="50" y="104" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;form id="availability" method="get"</text><text x="50" y="137" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;toolname="check_availability"</text><text x="50" y="170" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;tooldescription="Check whether the</text><text x="50" y="203" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;&#160;&#160;cabin Fjellro is free ..."</text><text x="50" y="236" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;toolautosubmit&gt;</text><text x="50" y="269" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start"></text><text x="50" y="302" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;label for="...checkIn"&gt;Check-in&lt;/label&gt;</text><text x="50" y="335" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;input name="checkIn" type="date"</text><text x="50" y="368" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;required toolparamdescription=</text><text x="50" y="401" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;&#160;&#160;"Arrival date"&gt;</text><text x="50" y="434" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start"></text><text x="50" y="467" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;input name="checkOut" type="date"</text><text x="50" y="500" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;required toolparamdescription=...&gt;</text><text x="50" y="533" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start"></text><text x="50" y="566" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;input name="guests" type="number"</text><text x="50" y="599" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;min="1" max="6" required</text><text x="50" y="632" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;toolparamdescription=...&gt;</text><rect x="640" y="66" width="530" height="620" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="660" y="104" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">name: "check_availability"</text><text x="660" y="144" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">description: "Check whether ..."</text><text x="660" y="184" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#5A6478" text-anchor="start">(agent may submit: toolautosubmit)</text><text x="660" y="224" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start"></text><text x="660" y="264" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">inputSchema:</text><text x="660" y="304" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;checkIn:&#160;&#160;string, format "date"</text><text x="660" y="344" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;&#160;&#160;description: "Arrival date</text><text x="660" y="384" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;(Dates MUST be ... 'YYYY-MM-DD')"</text><text x="660" y="424" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;checkOut: string, format "date"</text><text x="660" y="464" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;guests:&#160;&#160;&#160;number, minimum 1,</text><text x="660" y="504" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;maximum 6, multipleOf 1</text><text x="660" y="544" font-family="IBM Plex Mono" font-size="15.5" font-weight="400" fill="#171A22" text-anchor="start">&#160;&#160;required: checkIn, checkOut, guests</text><path d="M592 132 C 615 132, 615 99, 638 99" stroke="#5A6478" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M592 165 C 615 165, 615 139, 638 139" stroke="#5A6478" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M592 330 C 615 330, 615 299, 638 299" stroke="#5A6478" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M592 594 C 615 594, 615 459, 638 459" stroke="#5A6478" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="660" y="620" font-family="Literata" font-size="16" font-weight="400" fill="#8F5A0C" text-anchor="start">Types, formats, limits and required come from</text><text x="660" y="646" font-family="Literata" font-size="16" font-weight="400" fill="#8F5A0C" text-anchor="start">the form itself. Chrome adds the date hint.</text></svg>
