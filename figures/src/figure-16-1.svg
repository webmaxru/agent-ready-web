<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="570" fill="#FFFFFF"/><text x="30" y="44" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#5A6478" text-anchor="start">AS A CARRIER</text><text x="200" y="44" font-family="Literata" font-size="16" fill="#5A6478" text-anchor="start">Your site delivers a stranger's instructions</text><rect x="30" y="64" width="250" height="210" rx="14" fill="#F9E8F1" stroke="#C2468A" stroke-width="2"/><text x="48" y="96" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#C2468A" text-anchor="start">RISK</text><text x="48" y="126" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Hostile review</text><text x="48" y="156" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">polite on screen,</text><text x="48" y="180" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">instructions hidden</text><text x="48" y="204" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">in text, alt, JSON-LD</text><rect x="330" y="64" width="280" height="210" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="348" y="96" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A54F0" text-anchor="start">THE SITE</text><text x="348" y="126" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Nordlys Cabins</text><text x="348" y="156" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">HTML + a11y tree</text><text x="348" y="180" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">JSON-LD Review</text><text x="348" y="204" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">Markdown, llms.txt</text><text x="348" y="228" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">API, MCP, WebMCP</text><rect x="660" y="64" width="230" height="210" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="678" y="96" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#B87613" text-anchor="start">THE AGENT</text><text x="678" y="126" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Guest's agent</text><text x="678" y="156" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">reads every</text><text x="678" y="180" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">channel as content</text><rect x="940" y="64" width="230" height="210" rx="14" fill="#F9E8F1" stroke="#C2468A" stroke-width="2"/><text x="958" y="96" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#C2468A" text-anchor="start">DAMAGE</text><text x="958" y="126" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Elsewhere</text><text x="958" y="156" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">data leaked,</text><text x="958" y="180" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">wrong action on</text><text x="958" y="204" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">another site</text><line x1="282" y1="169.0" x2="326" y2="169.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="612" y1="169.0" x2="656" y2="169.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="892" y1="169.0" x2="936" y2="169.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="30" y="310" font-family="Bricolage Grotesque" font-size="18" font-weight="800" fill="#5A6478" text-anchor="start">AS A VICTIM</text><text x="190" y="310" font-family="Literata" font-size="16" fill="#5A6478" text-anchor="start">Your site receives an agent hijacked somewhere else</text><rect x="30" y="330" width="250" height="210" rx="14" fill="#F9E8F1" stroke="#C2468A" stroke-width="2"/><text x="48" y="362" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#C2468A" text-anchor="start">RISK</text><text x="48" y="392" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Hostile page</text><text x="48" y="422" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">on any other site</text><text x="48" y="446" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">the guest visits</text><rect x="330" y="330" width="280" height="210" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="348" y="362" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#B87613" text-anchor="start">THE AGENT</text><text x="348" y="392" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Guest's agent</text><text x="348" y="422" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">valid session or token,</text><text x="348" y="446" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">goal changed by</text><text x="348" y="470" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="start">what it read</text><rect x="660" y="330" width="510" height="210" rx="14" fill="#EEEDFE" stroke="#5A54F0" stroke-width="2"/><text x="678" y="362" font-family="Bricolage Grotesque" font-size="15" font-weight="800" fill="#5A54F0" text-anchor="start">THE SITE</text><text x="678" y="392" font-family="Bricolage Grotesque" font-size="21" font-weight="800" fill="#171A22" text-anchor="start">Nordlys: cancel, read, change?</text><rect x="680" y="420" width="470" height="100" rx="9" fill="#FFFFFF" stroke="#3F38D6" stroke-width="2"/><text x="700" y="452" font-family="Bricolage Grotesque" font-size="17" font-weight="700" fill="#171A22" text-anchor="start">What decides here is your server:</text><text x="700" y="480" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">owner check, confirmation bound to state,</text><text x="700" y="504" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">idempotency key, audit log</text><line x1="282" y1="435.0" x2="326" y2="435.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="612" y1="435.0" x2="656" y2="435.0" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/></svg>