<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="700" fill="#FFFFFF"/><text x="40" y="48" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#8F5A0C" text-anchor="start">Agents</text><text x="420" y="48" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#3F38D6" text-anchor="start">The doors Nordlys offers</text><text x="900" y="48" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#3F38D6" text-anchor="start">One business logic</text><rect x="30" y="80" width="330" height="130" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="50" y="120" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Agent in a data centre</text><text x="50" y="152" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Claude, ChatGPT, a company agent</text><text x="50" y="180" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">own credentials, OAuth (Chapter 14)</text><rect x="420" y="70" width="400" height="70" rx="9" fill="#ECEBFE" stroke="#5A54F0" stroke-width="2"/><text x="440" y="103" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Public API</text><text x="440" y="127" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">/api/v1/...  (Chapter 7)</text><rect x="420" y="160" width="400" height="70" rx="9" fill="#ECEBFE" stroke="#5A54F0" stroke-width="2"/><text x="440" y="193" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">MCP server</text><text x="440" y="217" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">/mcp  (Chapter 8)</text><line x1="362" y1="130" x2="416" y2="105" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="362" y1="160" x2="416" y2="195" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="890" y="70" width="280" height="570" rx="14" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="1030" y="300" font-family="Bricolage Grotesque" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Nordlys store</text><text x="1030" y="336" font-family="Literata" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">search, availability,</text><text x="1030" y="362" font-family="Literata" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">prices, bookings</text><text x="1030" y="414" font-family="Literata" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">the same rules for</text><text x="1030" y="440" font-family="Literata" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle">every door and form</text><line x1="822" y1="105" x2="886" y2="105" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="822" y1="195" x2="886" y2="195" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><rect x="30" y="280" width="830" height="390" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="50" y="316" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#0B7F7F" text-anchor="start">The guest's browser</text><text x="50" y="344" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">her session, cookies and language, the page she sees</text><rect x="50" y="425" width="250" height="90" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="70" y="462" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">The guest</text><text x="70" y="491" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">watches and confirms</text><rect x="50" y="535" width="250" height="115" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="70" y="568" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Browser agent</text><text x="70" y="596" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">built in, an extension,</text><text x="70" y="622" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">or a test tool</text><rect x="350" y="370" width="490" height="280" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="370" y="402" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#171A22" text-anchor="start">Nordlys page</text><rect x="380" y="425" width="440" height="90" rx="9" fill="#F6F7FB" stroke="#DCE1EC" stroke-width="2"/><text x="400" y="458" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">The visible page and forms</text><text x="400" y="487" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">filled and updated as the agent works</text><rect x="380" y="545" width="440" height="90" rx="9" fill="#ECEBFE" stroke="#5A54F0" stroke-width="2"/><text x="400" y="578" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="start">WebMCP tools (Chapter 9)</text><text x="400" y="606" font-family="IBM Plex Mono" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">search_cabins, start_booking, ...</text><line x1="302" y1="470" x2="376" y2="470" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><line x1="302" y1="590" x2="376" y2="590" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="312" y="580" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">calls</text><text x="306" y="460" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">sees</text><line x1="600" y1="543" x2="600" y2="519" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 5"/><text x="612" y="536" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">keeps in step</text><line x1="822" y1="590" x2="886" y2="590" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="823" y="577" font-family="IBM Plex Mono" font-size="13" font-weight="400" fill="#5A6478" text-anchor="start">/_tools</text></svg>