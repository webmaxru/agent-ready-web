<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="640" fill="#FFFFFF"/><rect x="470" y="40" width="260" height="90" rx="14" fill="#EEEDFD" stroke="#5A54F0" stroke-width="2"/><text x="600" y="80" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="middle">/cabins/fjellro</text><text x="600" y="110" font-family="Literata" font-size="16" font-weight="400" fill="#5A6478" text-anchor="middle" font-style="italic">one page, three views</text><rect x="40" y="190" width="360" height="330" rx="14" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="60" y="230" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">1. Server HTML</text><text x="60" y="256" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">no JavaScript</text><text x="60" y="292" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;header&gt;…&lt;/header&gt;</text><text x="60" y="320" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">&lt;main&gt;</text><text x="60" y="348" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;h1&gt;Fjellro&lt;/h1&gt;</text><text x="60" y="376" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;form id="availability"&gt;</text><text x="60" y="404" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    &lt;label for=…&gt;Check-in</text><text x="60" y="432" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    &lt;input type="date" …&gt;</text><text x="60" y="460" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  &lt;button&gt;Check availability</text><text x="220" y="560" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="middle">Fetch-only agents</text><text x="220" y="586" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">crawlers, fetch tools</text><path d="M600 132 C 600 160, 220 160, 220 186" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="420" y="190" width="360" height="330" rx="14" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="440" y="230" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">2. Accessibility tree</text><text x="440" y="256" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">after rendering</text><text x="440" y="292" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">- main:</text><text x="440" y="320" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  - heading "Fjellro"</text><text x="440" y="348" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">  - region "Check availability":</text><text x="440" y="376" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    - textbox "Check-in"</text><text x="440" y="404" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    - spinbutton "Guests": "2"</text><text x="440" y="432" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    - button "Check availability"</text><text x="440" y="460" font-family="IBM Plex Mono" font-size="14.5" font-weight="400" fill="#171A22" text-anchor="start">    - status</text><text x="600" y="560" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="middle">Browsing agents</text><text x="600" y="586" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">read it first</text><path d="M600 132 C 600 160, 600 160, 600 186" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="800" y="190" width="360" height="330" rx="14" fill="#F6F7FB" stroke="#5A6478" stroke-width="2"/><text x="820" y="230" font-family="Bricolage Grotesque" font-size="22" font-weight="800" fill="#171A22" text-anchor="start">3. Screenshot</text><text x="820" y="256" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start" font-style="italic">pixels only</text><rect x="820" y="280" width="320" height="36" rx="9" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><rect x="820" y="328" width="200" height="110" rx="9" fill="#EEF1F8" stroke="#DCE1EC" stroke-width="2"/><rect x="1032" y="328" width="108" height="22" rx="6" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><rect x="1032" y="358" width="108" height="22" rx="6" fill="#FFFFFF" stroke="#DCE1EC" stroke-width="2"/><rect x="1032" y="394" width="108" height="30" rx="6" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="820" y="470" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">Roles, names and URLs are not</text><text x="820" y="492" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="start">in the picture. The model guesses.</text><text x="980" y="560" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#171A22" text-anchor="middle">Vision agents</text><text x="980" y="586" font-family="Literata" font-size="15" font-weight="400" fill="#5A6478" text-anchor="middle">and fallbacks</text><path d="M600 132 C 600 160, 980 160, 980 186" stroke="#5A6478" stroke-width="2.5" fill="none" marker-end="url(#arr)"/></svg>
