<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6478"/></marker></defs><rect width="1200" height="820" fill="#FFFFFF"/><rect x="10" y="30" width="200" height="56" rx="9" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="110" y="66" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">Browser agent</text><line x1="110" y1="86" x2="110" y2="712" stroke="#DCE1EC" stroke-width="2" stroke-dasharray="6 6"/><rect x="245" y="30" width="200" height="56" rx="9" fill="#E7F6F6" stroke="#0EA5A5" stroke-width="2"/><text x="345" y="66" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">Browser</text><line x1="345" y1="86" x2="345" y2="712" stroke="#DCE1EC" stroke-width="2" stroke-dasharray="6 6"/><rect x="490" y="30" width="200" height="56" rx="9" fill="#FFFFFF" stroke="#5A54F0" stroke-width="2"/><text x="590" y="66" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">Booking form</text><line x1="590" y1="86" x2="590" y2="712" stroke="#DCE1EC" stroke-width="2" stroke-dasharray="6 6"/><rect x="735" y="30" width="200" height="56" rx="9" fill="#ECEBFE" stroke="#5A54F0" stroke-width="2"/><text x="835" y="66" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#171A22" text-anchor="middle">The guest</text><line x1="835" y1="86" x2="835" y2="712" stroke="#DCE1EC" stroke-width="2" stroke-dasharray="6 6"/><rect x="975" y="30" width="200" height="56" rx="9" fill="#5A54F0" stroke="#3F38D6" stroke-width="2"/><text x="1075" y="66" font-family="Bricolage Grotesque" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Nordlys server</text><line x1="1075" y1="86" x2="1075" y2="712" stroke="#DCE1EC" stroke-width="2" stroke-dasharray="6 6"/><line x1="110" y1="140" x2="341" y2="140" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="227.5" y="128" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="middle">calls book_cabin</text><text x="240" y="164" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">dates, guests, name, email</text><line x1="345" y1="215" x2="586" y2="215" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="467.5" y="203" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="middle">fills the fields</text><text x="467.5" y="239" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">:tool-form-active</text><line x1="590" y1="290" x2="831" y2="290" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="712.5" y="278" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="middle">shows the note</text><text x="712.5" y="314" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">"Check every detail..."</text><rect x="96" y="172" width="28" height="470" rx="6" fill="#FBF3E6" stroke="#B87613" stroke-width="2"/><text x="140" y="420" font-family="Literata" font-size="16" font-weight="400" fill="#8F5A0C" text-anchor="start">the call</text><text x="140" y="442" font-family="Literata" font-size="16" font-weight="400" fill="#8F5A0C" text-anchor="start">stays open</text><line x1="835" y1="380" x2="594" y2="380" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="712.5" y="368" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="middle">ticks the terms, presses</text><text x="712.5" y="404" font-family="IBM Plex Mono" font-size="14" font-weight="400" fill="#5A6478" text-anchor="middle">Confirm booking</text><line x1="590" y1="460" x2="1071" y2="460" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="832.5" y="448" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="middle">POST /book/hardanger-hytte</text><rect x="985" y="490" width="180" height="70" rx="9" fill="#EEF1F8" stroke="#5A6478" stroke-width="2"/><text x="1075" y="520" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="middle">validates and</text><text x="1075" y="544" font-family="Literata" font-size="16" font-weight="400" fill="#171A22" text-anchor="middle">books (the store)</text><line x1="1075" y1="610" x2="349" y2="610" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="710.0" y="598" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="middle">303 to the confirmation page</text><line x1="345" y1="690" x2="114" y2="690" stroke="#5A6478" stroke-width="2.5" marker-end="url(#arr)"/><text x="136" y="678" font-family="Literata" font-size="17" font-weight="400" fill="#171A22" text-anchor="start">the call ends with the navigation</text><text x="110" y="740" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">The agent reads the confirmation page like any visitor.</text><text x="110" y="766" font-family="Literata" font-size="17" font-weight="400" fill="#5A6478" text-anchor="start">Nothing reaches the server before the guest acts.</text></svg>