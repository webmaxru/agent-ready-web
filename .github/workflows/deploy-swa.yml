name: deploy-swa
# Builds the web edition (python3 tools/build.py site -> dist/site) and uploads it to the
# Azure Static Web App created by infra/deploy.sh (Free plan). Needs one repository secret,
# AZURE_STATIC_WEB_APPS_API_TOKEN (the app's deployment token; infra/deploy.sh sets it).
# Until that secret exists (forks, a fresh clone, PRs) this workflow skips and stays green.
#
# Rollback: Actions > deploy-swa > Run workflow > ref = a release tag (e.g. v1.0.0).
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Published stable release tag or full commit SHA to deploy (also the rollback path)"
        required: true

permissions:
  contents: read

concurrency:
  group: swa-production
  cancel-in-progress: false

jobs:
  published-source:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.sha }}
    steps:
      - name: Skip until the Static Web App exists
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::warning title=Web edition NOT deployed::AZURE_STATIC_WEB_APPS_API_TOKEN is missing. Run ./infra/deploy.sh (see DEPLOY.md), then re-run this workflow with ref = the release tag."
          {
            echo "## Web edition NOT deployed"
            echo
            echo "Nothing was uploaded for \`$DEPLOY_REF\`: the **AZURE_STATIC_WEB_APPS_API_TOKEN** repository secret is missing."
            echo "Run \`./infra/deploy.sh\` (see DEPLOY.md), then **Actions → deploy-swa → Run workflow** with ref = the release tag."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the trusted production gate (main)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
      - name: Require published book content using main's release policy
        id: source
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/book_release.py published-source

  deploy:
    needs: published-source
    if: needs.published-source.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: book
    env:
      DEPLOY_REF: ${{ needs.published-source.outputs.sha }}
    steps:
      - name: Checkout main's site validator
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout the verified published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_REF }}
          path: book
          persist-credentials: false

      - name: Check that this ref has the build pipeline
        run: |
          if [ ! -f tools/build.py ]; then
            echo "::error::$DEPLOY_REF has no tools/build.py, so it can't be built by this workflow. Pick a release tag."
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: book/tools/requirements*.txt

      - name: Build the site
        run: |
          req=tools/requirements.txt
          [ -f tools/requirements-site.txt ] && req=tools/requirements-site.txt
          python3 -m pip install -r "$req"
          python3 tools/build.py site
          test -f dist/site/index.html
          # tools/build.py copies it; this covers older build scripts.
          if [ -f staticwebapp.config.json ] && [ ! -f dist/site/staticwebapp.config.json ]; then
            cp staticwebapp.config.json dist/site/
          fi
          echo "dist/site: $(find dist/site -type f | wc -l) files, $(du -sh dist/site | cut -f1)"

      - name: Pre-upload check (Free plan limits, CSP vs. the pages)
        run: python3 ../trusted/infra/check_site.py dist/site

      - name: Deploy to Azure Static Web Apps (production)
        id: swa
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: book/dist/site
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        env:
          SITE: ${{ steps.swa.outputs.static_web_app_url }}
        run: |
          SITE="${SITE%/}"
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/" || true)
            [ "$code" = 200 ] && break
            sleep 10
          done
          missing=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/no-such-page-$GITHUB_RUN_ID" || true)
          agents=""
          for p in llms.txt robots.txt sitemap.xml index.md .well-known/ard.json .well-known/agent-skills/index.json; do
            agents="$agents \`/$p\` $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/$p" || true);"
          done
          link=$(curl -sI --max-time 20 "$SITE/" | grep -i '^link:' | head -c 160 || true)
          {
            echo "## Web edition deployed"
            echo
            echo "- Ref: \`$DEPLOY_REF\`"
            echo "- URL: $SITE"
            echo "- \`/\` -> $code, missing page -> $missing (expected 200 and 404)"
            echo "- Agent files:$agents (expected 200 each)"
            echo "- Home page Link header: \`${link:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] || { echo "::error::$SITE/ answered $code"; exit 1; }
