# Publishes one GitHub Release from an owner-approved, merged content update: the PDF, the print
# PDF (7.5 x 9.25 in, KDP), the EPUB, the HTML edition (zip) and SHA256SUMS.txt, with the
# version's CHANGELOG.md section as the notes. Then it deploys that release to the web edition.
# See RELEASING.md.
#
# Started only by workflow_dispatch:
#   - by approved-book.yml after it merges an approved pull request (pr, head_sha, base_sha,
#     merge_sha and tag), or
#   - by hand, for recovery: Run workflow with the PR number (and tag), or with only the tag of
#     an existing release. The same provenance checks run either way.
#
#   plan     read-only: the merge is the approved PR's squash on main, its tree is the approved
#            head, the tag matches tools/book.json, the previous release is an ancestor, and an
#            existing tag points at the merge. A published release with every file is a no-op.
#   build    every edition from the exact merge commit, before any tag exists
#   publish  annotated tag at the merge (never moved), draft release, upload, verify, publish.
#            Only the highest stable version is marked Latest. Published files are never
#            replaced: a fix is a new patch version.
#   deploy   after a new highest stable publication, dispatch deploy-swa.yml for its tag.
#            Require that run's upload and smoke test; missing credentials fail delivery.
#
# Merging a release/ branch, the "release" label and pushing a tag no longer publish anything.
# Uses only the built-in GITHUB_TOKEN.
name: Release book

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Approved, merged pull request number (empty = find it from the tag)"
        required: false
        default: ""
      head_sha:
        description: "Approved head SHA (optional; checked when given)"
        required: false
        default: ""
      base_sha:
        description: "Base SHA the head was approved against (optional; checked when given)"
        required: false
        default: ""
      merge_sha:
        description: "Squash merge commit on main (optional; checked when given)"
        required: false
        default: ""
      tag:
        description: "vX.Y.Z (optional with a PR; read from tools/book.json at the merge)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: book-publish
  cancel-in-progress: false

jobs:
  plan:
    name: Check provenance (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      merge_sha: ${{ steps.plan.outputs.merge_sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      recovery: ${{ steps.plan.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          [ -n "$PR" ] && args+=(--pr "$PR")
          python tools/book_release.py release-plan "${args[@]}" --head "$HEAD_SHA" --base "$BASE_SHA" \
            --merge-sha "$MERGE_SHA" --tag "$TAG"

  build:
    name: Build the editions (exact merge commit, before tagging)
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.recovery != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      editions: ${{ steps.editions.outputs.artifact-id }}
      notes: ${{ steps.notes.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.merge_sha }}
    steps:
      - name: Checkout the trusted release tools (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout the merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.merge_sha }}
          path: book
          fetch-depth: 0
          persist-credentials: false
      - name: Version, dated CHANGELOG section, tag and ancestry
        run: |
          python trusted/tools/validate_release.py release --root book --tag "$TAG" --sha "$SHA" --allow-existing-tag
          python trusted/tools/validate_release.py notes --root book --tag "$TAG" --repo "$GITHUB_REPOSITORY" > release-notes.md
          cat release-notes.md
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the build tools
        timeout-minutes: 12
        working-directory: book
        run: |
          timeout 420 pip install -r tools/requirements.txt
          timeout 300 python -m playwright install chromium
      - name: Manuscript lint
        working-directory: book
        run: python ../trusted/tools/lint_manuscript.py --manuscript manuscript
      - name: Build the web edition (zip), the EPUB, the PDF and the print PDF
        timeout-minutes: 25
        working-directory: book
        env:
          BOOK_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python tools/build.py all 2>&1 | tee build.log
          if grep -q '^warning:' build.log; then echo "::error::the build printed warnings"; exit 1; fi
          python ../trusted/infra/check_site.py dist/site
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: EPUBCheck
        timeout-minutes: 8
        working-directory: book
        run: |
          curl -sSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
          java -jar /tmp/epubcheck-5.2.1/epubcheck.jar dist/*.epub
      - name: Collect the release files and checksums
        run: |
          mkdir release
          cp book/dist/*.pdf book/dist/*.epub book/dist/*.zip release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l release
      - uses: actions/upload-artifact@v7
        id: editions
        with:
          name: editions-${{ env.TAG }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        id: notes
        with:
          name: release-notes-${{ env.TAG }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tag and publish the GitHub Release
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.recovery != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
      pull-requests: read
      actions: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.merge_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: editions-${{ env.TAG }}
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ env.TAG }}
      - name: Re-check provenance (nothing changed since the plan)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          args=()
          [ -n "$PR" ] && args+=(--pr "$PR")
          python trusted/tools/book_release.py release-plan "${args[@]}" --merge-sha "$SHA" --tag "$TAG" > plan.txt
          cat plan.txt
          grep -qx 'recovery=false' plan.txt || { echo "::error::$TAG was published meanwhile; nothing to do"; exit 1; }
      - name: Annotated tag, draft, upload, verify, publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python trusted/tools/book_release.py publish --tag "$TAG" --merge-sha "$SHA" --assets release --notes release-notes.md

  deploy:
    name: Deploy the web edition
    needs: [plan, publish]
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dispatch deploy-swa for the tag and report the outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/book_release.py deploy --tag "${{ needs.plan.outputs.tag }}"

  cleanup:
    name: Remove verified publication staging
    needs: [plan, build, publish, deploy]
    if: always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.publish.result == 'success' && needs.publish.outputs.published == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify published bytes before removing this run's staging
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.merge_sha }}
          EDITIONS: ${{ needs.build.outputs.editions }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          python tools/artifact_storage.py release --run-id "$GITHUB_RUN_ID" \
            --tag "$TAG" --sha "$SHA" --editions "$EDITIONS" --notes "$NOTES"
